apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: camelracing
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: camelracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            # La imagen oficial de Postgres espera POSTGRES_DB/POSTGRES_USER/
            # POSTGRES_PASSWORD -> se mapean desde las claves DB_NAME/
            # DB_USERNAME/DB_PASSWORD del Secret (esos SÍ son los nombres
            # que espera Spring Boot en el backend).
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: camelracing-secret
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: camelracing-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: camelracing-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  # Este nombre es el mismo que usa DB_HOST en 02-configmap.yaml.
  name: postgres
  namespace: camelracing
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432