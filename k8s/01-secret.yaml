# Equivalente al .env que usas con Docker Compose. Las claves usan los
# MISMOS nombres que ya espera application-docker.yml (DB_NAME, DB_USERNAME,
# DB_PASSWORD, JWT_SECRET), para poder inyectarlas al backend con un solo
# envFrom, sin tener que mapearlas una por una.
apiVersion: v1
kind: Secret
metadata:
  name: camelracing-secret
  namespace: camelracing
type: Opaque
