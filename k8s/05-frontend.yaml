apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: camelracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Construida con frontend/Dockerfile (docker build -t
          # camelracing-frontend:latest ./frontend).
          image: camelracing-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: camelracing
spec:
  # NodePort, igual que pgadmin en el ejemplo del profesor: así se puede
  # entrar desde el navegador de tu máquina sin necesitar un Ingress.
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30510