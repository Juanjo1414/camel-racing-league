# Valores NO sensibles (equivalentes a las variables sueltas que en
# compose.yml no venían del .env). Separado del Secret a propósito: aquí
# solo va configuración, nunca credenciales.
apiVersion: v1
kind: ConfigMap
metadata:
  name: camelracing-config
  namespace: camelracing
data:
  SPRING_PROFILES_ACTIVE: "docker"
  # "postgres" es el nombre del Service que crea 03-postgres.yaml -> Kubernetes
  # resuelve ese nombre por DNS dentro del namespace, igual que Docker Compose
  # resolvía "db" por el nombre del servicio.
  DB_HOST: "postgres"
  DB_PORT: "5432"
  JWT_EXPIRATION: "3600000"
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGIN: "http://camelracing.127.0.0.1.nip.io"